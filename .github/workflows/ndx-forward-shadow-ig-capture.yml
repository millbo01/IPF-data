name: NDX Forward Shadow - IG Capture

on:
  workflow_dispatch:
  schedule:
    # One of these is 09:15 New York depending on US DST. The script exits
    # harmlessly on the wrong-DST trigger and waits until 09:31 on the right one.
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ndx-forward-shadow-ig
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IG_IDENTIFIER: ${{ secrets.IG_IDENTIFIER }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      IG_API_KEY: ${{ secrets.IG_API_KEY }}
      IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/index-morning-fade-ig
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Run read-only IG shadow capture
        run: python research/index_large_move_reversal/shadow_ig_capture.py

      - name: Commit shadow ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/index_large_move_reversal/forward_shadow
          if git diff --cached --quiet; then
            echo "No shadow ledger changes."
          else
            git commit -m "Record NDX forward-shadow event"
            git pull --rebase origin research/index-morning-fade-ig
            git push origin HEAD:research/index-morning-fade-ig
          fi

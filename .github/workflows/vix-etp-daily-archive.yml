name: VIX ETP Daily Public Archive

on:
  workflow_dispatch:
  schedule:
    # Tue-Sat: capture the latest provider-published Mon-Fri session data.
    - cron: "45 18 * * 2-6"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/vix-etp-flow-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml openpyxl xlrd

      - name: Collect official public VIX ETP data
        run: python research/vix_etp_flow/collect_public_holdings.py

      - name: Commit snapshot to research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vix_etp_flow
          if git diff --cached --quiet; then
            echo "No new VIX ETP snapshot changes."
          else
            git commit -m "Collect VIX ETP public holdings $(date -u +%F)"
            git push origin HEAD:research/vix-etp-flow-v2
          fi

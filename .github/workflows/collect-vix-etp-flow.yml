name: Collect VIX ETP flow inputs

on:
  workflow_dispatch:
  schedule:
    # Run after CFE/ETF providers have normally published prior-session data.
    # Tue-Sat captures Mon-Fri US trading sessions without wasting Sunday runs.
    - cron: "15 17 * * 2-6"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml openpyxl xlrd

      - name: Collect public VIX ETP holdings
        run: python research/vix_etp_flow/collect_public_holdings.py

      - name: Commit new snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vix_etp_flow
          if git diff --cached --quiet; then
            echo "No new VIX ETP snapshot changes."
          else
            git commit -m "Collect VIX ETP public holdings $(date -u +%F)"
            git push
          fi

name: select-universe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select coins by the frozen rule
        env:
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone, date, timedelta

          KEY = os.environ["COINALYZE_KEY"]
          CURRENT = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT",
                     "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "LINKUSDT", "LTCUSDT"]
          N_NEW, LISTED_BY, START = 20, date(2024, 3, 31), date(2020, 9, 1)
          STABLE = {"USDC", "FDUSD", "TUSD", "DAI", "USDP", "BUSD", "USDE", "USD1", "EUR"}
          API = "https://api.coinalyze.net/v1"
          OUT = "data/universe.txt"

          if os.path.exists(OUT):
              print(f"{OUT} already exists: the universe is frozen, nothing changed")
              raise SystemExit(0)

          def get(url, body=None):
              for _ in range(6):
                  try:
                      req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json",
                                                                            "User-Agent": "ipf-select"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          time.sleep(float(e.headers.get("Retry-After", "10")) + 1)
                          continue
                      raise
                  except Exception:
                      time.sleep(5)
              raise RuntimeError("request failed: " + url.split("?")[0])

          hl = get("https://api.hyperliquid.xyz/info", json.dumps({"type": "meta"}).encode())
          hl_names = {u["name"] for u in hl["universe"] if not u.get("isDelisted")}
          cands = {}
          for m in get(f"{API}/future-markets?api_key={KEY}"):
              s, base = m.get("symbol", ""), m.get("base_asset", "")
              sym = m.get("symbol_on_exchange") or s.split("_PERP")[0]
              if not s.endswith("_PERP.A") or not m.get("is_perpetual") or m.get("quote_asset") != "USDT":
                  continue
              if sym in CURRENT or not base or base in STABLE or base[0].isdigit() or not sym.isalnum() or base not in hl_names:
                  continue
              cands[s] = (sym, base)
          print(f"{len(cands)} candidate Binance USDT perps also listed on Hyperliquid (current 10 excluded)")
          time.sleep(2)

          now = datetime.now(timezone.utc)
          frm, to = int(datetime(2024, 1, 1, tzinfo=timezone.utc).timestamp()), int(now.timestamp())
          yr_ago = to - 365 * 86400
          rows, syms = [], list(cands)
          for i in range(0, len(syms), 20):
              chunk = syms[i:i + 20]
              res = get(f"{API}/open-interest-history?symbols={','.join(chunk)}&interval=daily&from={frm}&to={to}"
                        f"&convert_to_usd=true&api_key={KEY}")
              for item in res:
                  h = item.get("history", [])
                  if not h:
                      continue
                  ts = [x["t"] // 1000 if x["t"] > 1e11 else x["t"] for x in h]
                  first = datetime.fromtimestamp(ts[0], timezone.utc).date()
                  recent = [x["c"] for x, t in zip(h, ts) if t >= yr_ago]
                  sym, base = cands[item["symbol"]]
                  rows.append((sum(recent) / len(recent) if recent else 0.0, sym, base, first))
              time.sleep(1.6 * len(chunk))

          rows.sort(reverse=True)
          chosen, lines = [], ["rank,symbol,base,avg_oi_usd_m,first_seen,listed_by_2024_03_31,selected"]
          for rank, (avg, sym, base, first) in enumerate(rows, 1):
              ok = first <= LISTED_BY
              pick = ok and len(chosen) < N_NEW
              if pick:
                  chosen.append((sym, first))
              lines.append(f"{rank},{sym},{base},{avg / 1e6:.1f},{first},{ok},{pick}")
          for ln in lines[:36]:
              print(ln)
          with open("data/universe_candidates.csv", "w") as f:
              f.write("\n".join(lines) + "\n")
          with open(OUT, "w") as f:
              f.write(f"# Frozen {now:%Y-%m-%d}. Rule: original 10 plus the top {N_NEW} Binance USDT perps by average daily OI (USD)\n")
              f.write("# over the last 365 days, listed on Hyperliquid, trading by 2024-03-31; stablecoins and multiplier symbols excluded.\n")
              for c in CURRENT:
                  f.write(f"{c},{START}\n")
              for sym, first in chosen:
                  st = START if first <= date(2024, 1, 3) else first - timedelta(days=7)
                  f.write(f"{sym},{st}\n")
          print(f"selected {len(chosen)}: {' '.join(s for s, _ in chosen)}")
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.txt data/universe_candidates.csv 2>/dev/null || true
          git commit -m "Frozen coin universe" || echo "No changes"
          git pull --rebase
          git push

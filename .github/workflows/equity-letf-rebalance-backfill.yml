name: Equity LETF Rebalance Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/equity-letf-rebalance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Backfill official ProShares equity LETF history
        run: python research/equity_letf_rebalance/backfill_proshares_letf.py

      - name: Commit data to research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equity_letf_rebalance
          if git diff --cached --quiet; then
            echo "No equity LETF backfill changes."
          else
            git commit -m "Backfill equity LETF rebalance inputs"
            git push origin HEAD:research/equity-letf-rebalance
          fi

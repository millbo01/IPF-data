name: VIX ETP Public History Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/vix-etp-flow-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 lxml pypdf

      - name: Backfill official public history
        run: python research/vix_etp_flow/backfill_public_history.py

      - name: Build daily forced-flow signal
        run: python research/vix_etp_flow/build_proshares_signal.py

      - name: Extract Volatility Shares monthly AUM anchors
        run: python research/vix_etp_flow/extract_vs_monthly_aum.py

      - name: Commit backfill to research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vix_etp_flow/backfill
          if git diff --cached --quiet; then
            echo "No backfill changes."
          else
            git commit -m "Backfill VIX ETP public history"
            git push origin HEAD:research/vix-etp-flow-v2
          fi
